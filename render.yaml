envVarGroups:
  - name: knzin-shared
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: KNZiN
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: "3306"
      # Prompted in Render UI during Blueprint setup:
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_SSL_CA_CONTENT
        sync: false
      - key: FRONTEND_URL
        sync: false

services:
  # 1. Main Web API Service (Laravel 11 / PHP 8.3 & Apache)
  - type: web
    name: knzin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /up
    envVarGroups:
      - knzin-shared
    envVars:
      - key: GOOGLE_AUTH_MOCK
        value: "true"

  # 2. Background Queue Worker (Mints promotional draw tickets & processes async jobs)
  - type: worker
    name: knzin-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600 --timeout=120
    plan: starter
    envVarGroups:
      - knzin-shared

  # 3. Scheduled Cron Tasks (Order TTL expiry, abandoned carts, reconciliation)
  - type: cron
    name: knzin-scheduler
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    plan: starter
    envVarGroups:
      - knzin-shared
